# CI — the gate, and the SAME gate the repo already defines for a human.
#
# ── WHY THIS CHANGED (2026-10-01) ──────────────────────────────────────────────────────────────
# This workflow used to run build + smoke + db:test. package.json defines `verify` as
#
#     test && audit && build && smoke:ui && smoke:authed
#
# so CI was checking roughly half of it, and the missing half included `npm run audit`, where the
# COLUMN CONTRACT lives. That is not an abstract gap. Twice in two days a reviewer caught a release
# claim that was wrong, and BOTH times the machine could have caught it instead and simply was not
# looking:
#
#   · "db suite green" while `npm test` exited 1 — a grep over the log hid the failure.
#   · "full suite green by exit code" while `npm run audit` had never been run — it was failing on
#     a select naming a column production does not have.
#
# The common cause was somebody (me) choosing a cheaper subset and reporting its result as the real
# one. The fix is not to try harder. It is to make the subset impossible: CI runs `npm run verify`
# ITSELF rather than a hand-copied list of its parts, so the two cannot drift. Change what verified
# means in package.json and this follows automatically.
#
# ── WHY claude/** IS HERE ──────────────────────────────────────────────────────────────────────
# Work from an agent lands on a claude/** branch and is gated here BEFORE a human reads it, so the
# owner reviews substance rather than discovering that a gate was skipped. The trigger already
# listed claude/** before this change; nothing had ever used it.
name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

# Read the code and nothing else (R14 — the 10/10 audit, F21): no workflow here writes to the repository, so none is given
# the token's write rights.
permissions:
  contents: read

# A newer push to a branch stops the older run — but never on main (R14 — the 10/10 audit, F20): every push to main is
# deployed by Vercel, so every one is verified to the end; cancelling the first left a shipped commit unchecked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    # ubuntu-24.04, named — not ubuntu-latest (2026-10-11). GitHub moves ubuntu-latest to Ubuntu 26 from
    # October 19, 2026 (the notice on every run of this workflow), and `playwright install --with-deps`
    # installs system libraries by distro version: a silent OS change under the gate is how it goes red
    # for a reason no commit made. Move to 26.04 on purpose, in its own change, with Playwright alongside.
    runs-on: ubuntu-24.04
    # 40, not 30 (R40 — the fresh audit's OPS11-07): the whole gate took 20m 45s, 20m 57s and 21m 20s on main's last full
    # runs (R32, R33, R29), and every round adds to it — a third more on a slower runner and a green tree would be cut off
    # as a red one. A run that hangs still ends; one that is only slow is let finish.
    timeout-minutes: 40
    steps:
      # Every action by the commit it is, not by a tag (R30 — the 10/10 audit, operations F21, security F14): a tag is a
      # pointer its owner — or whoever takes their account — can move to other code, and the job runs whatever it points
      # at with this repository checked out. Beside each is the release that commit is, the same code `@v4` ran on
      # 2026-10-18. .github/dependabot.yml proposes the next one, once a month.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The Node production runs (R14 — the 10/10 audit, F24): .nvmrc, the same major as package.json's engines, which
      # Vercel builds and serves with. This said 22 while production ran 24 — the gate checked a different runtime.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # smoke:ui drives a real browser. scripts/smoke.ui.mjs prefers a container-local Chromium and
      # falls back to Playwright's own when that path does not exist, which is the case on a runner.
      - name: Install Chromium for the UI smoke
        run: npx playwright install --with-deps chromium

      # THE LINT RATCHET IS IN THE GATE NOW (R40 — the fresh audit's OPS11-05). It ran here, beside verify, so the owner's
      # `npm run verify` before a push never ran it: a hook under a condition went green there and red here half an hour
      # after the deploy. It is the first audit in `npm run audit` (scripts/lint.ratchet.mjs, its report handed to
      # render.audit — one eslint pass), so both gates run it, by the one definition.

      # THE WHOLE GATE, BY ITS OWN NAME. Do not expand this into separate steps: a copied list is a
      # second definition of "verified" and it will drift from package.json the first time either
      # one changes. The log names whichever link failed.
      # The last two links (2026-10-06, the iPhone round) build the iPhone app's copy of the screens
      # and open it on three iPhones in Chromium (scripts/smoke.native.mjs); what needs a Mac is in
      # ios.yml.
      #
      # NO SECRETS HERE (R14 — the 10/10 audit, F9 and F21). The signed-in smoke's account used to sit on this job, where
      # it could never be used — this build has no database by design (smoke:ui measures the guest app), so smoke:authed
      # could only say NOT CHECKED — while `npm ci`'s lifecycle scripts and the browser install could read a staff
      # account's password. smoke:authed says NOT CHECKED here, and opens the console signed in for real in the
      # Production workflow, against the deployed site, after each deploy and daily.
      - name: verify (test && audit — the lint ratchet and the secrets audit among them — && build && smoke:ui && smoke:authed && smoke:console && build:app && smoke:native)
        run: npm run verify

  # WHAT SHIPS CARRIES NO PUBLISHED ADVISORY OF NOTE (R30 — the 10/10 audit, operations F24). npm's advisory database,
  # asked of the dependencies that reach a phone or the server, failing on high and critical. The build tools' own
  # (eslint's, the Capacitor CLI's) are left out — they never leave the build, and their fixes wait on their makers.
  # A job of its own, beside verify and not in front of it: an advisory published today must not hide what the gate
  # says about the push, and its red names itself. The Production workflow asks the same every morning, so an advisory
  # published between pushes is heard as well. It reads the lockfile only — nothing installed, no secret here.
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: npm audit (what ships)
        run: npm audit --omit=dev --audit-level=high
