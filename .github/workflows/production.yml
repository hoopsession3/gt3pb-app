# PRODUCTION — the gate that runs AFTER the deploy, on the real site.
#
# ci.yml runs `npm run verify` on the tree: a build with no database, so what it measures on a
# data-driven route is the empty state, and nothing in it can say whether Vercel built this commit,
# whether the migration ledger is current, or how /primal paints with real lessons in it.
# scripts/verify.prod.mjs is that other half, and until 2026-10-02 it was one person with a
# browser after every push. This runs it three ways:
#
#   push to main   — wait up to 15 minutes for app.gt3pb.com to report THIS commit, then the full
#                    run (ledger, posture, JSON probes, 23 routes painted at phone width + axe).
#                    A deploy that never lands, or lands wrong, is a red run — in the inbox, not
#                    a complaint at the window.
#   every 30 min   — --quick: health, ledger, posture, probes. No browser. The uptime check this
#                    app did not have (R-list: "uptime monitor on /api/health"). At :07 and :37,
#                    not :00 and :30 — GitHub's own docs: "High load times include the start of
#                    every hour … schedule your workflow to run at a different time of the hour."
#                    Every run stamps the heartbeat, and heartbeat_watchdog (0340) waits THREE of
#                    these periods before it calls the check quiet; scripts/smoke.cjs reads this
#                    schedule and that threshold and fails if the two stop fitting.
#   daily 06:10 UTC — the full run again, because production can drift between deploys
#                    (a row that changes how a page paints, a policy pasted by hand).
#
# Everything verify:prod checks is what a guest can see, and it has no secrets. ONE step has two
# (R14 — the 10/10 audit, F9): the full runs then open the crew console's sections on the deployed
# site as a dedicated staff account (scripts/smoke.authed.mjs — read-only, it navigates and watches
# the wire), because ci.yml's build has no database and cannot. The scheduled runs stop
# automatically after 60 days without a push (GitHub's rule) — a dormant repo is not a monitored
# one, and that is fine.
name: Production

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "7,37 * * * *"   # quick
    - cron: "10 6 * * *"     # full
  workflow_dispatch:
    inputs:
      quick:
        description: "quick (no browser)"
        type: boolean
        default: false

# Read the code and nothing else (R14 — the 10/10 audit, F21): no workflow here writes to the repository, so none is given
# the token's write rights.
permissions:
  contents: read

# One group per kind of run (R14 — the 10/10 audit, F25). GitHub keeps one PENDING run per group, so with a single group
# the next half-hourly quick check replaced a push's check of its own deploy while an earlier run was still going — and
# that push was never checked. A push, the quick schedule, the daily full run and a manual run now queue apart.
concurrency:
  group: production-${{ github.event_name }}-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  verify-production:
    # ubuntu-24.04, named — not ubuntu-latest (2026-10-11). GitHub moves ubuntu-latest to Ubuntu 26 from
    # October 19, 2026 (the notice on every run of this workflow), and `playwright install --with-deps`
    # installs system libraries by distro version: a silent OS change under the gate is how it goes red
    # for a reason no commit made. Move to 26.04 on purpose, in its own change, with Playwright alongside.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Every action by the commit it is, not by a tag that can be moved (R30 — operations F21; see ci.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The Node production runs (R14 — the 10/10 audit, F24): .nvmrc, the same major as package.json's engines, which
      # Vercel builds and serves with. This said 22 while production ran 24 — the gate checked a different runtime.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Which form this run is. A push waits for its own deploy; the half-hourly schedule is quick;
      # the daily schedule and a manual run are full unless asked otherwise.
      - name: Decide the form
        id: form
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "args=--wait=900" >> "$GITHUB_OUTPUT"; echo "browser=yes" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "7,37 * * * *" ]; then
            # a short wait so a run that lands mid-deploy is not a false red
            echo "args=--quick --wait=240" >> "$GITHUB_OUTPUT"; echo "browser=no" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.quick }}" = "true" ]; then
            echo "args=--quick" >> "$GITHUB_OUTPUT"; echo "browser=no" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"; echo "browser=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Chromium for the painted pass
        if: steps.form.outputs.browser == 'yes'
        run: npx playwright install --with-deps chromium

      # THE GATE, BY ITS OWN NAME — the same script a person runs. Change what verified-in-production
      # means in scripts/verify.prod.mjs and this follows.
      # The check names itself to /api/health (R19 — the 10/10 audit, operations F6): with the site's HEALTH_PROBE_SECRET set,
      # only a check carrying the same secret feeds the watchdog. The repository secret of that name; unset, it sends none.
      # And it asks the deployed push function which build it is (R21 — operations F12): the database's two public
      # values, the repository VARIABLES smoke:authed and the iPhone build read. Unset: that one check says so and passes.
      - name: verify:prod
        env:
          HEALTH_PROBE_SECRET: ${{ secrets.HEALTH_PROBE_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run verify:prod -- ${{ steps.form.outputs.args }}

      # THE CREW CONSOLE, SIGNED IN, ON THE DEPLOYED SITE (R14 — the 10/10 audit, F9). verify:prod sees what a guest
      # sees; this opens every section of /crew as a dedicated staff account and fails on any 4xx/5xx from the database or
      # the app's own API, a "couldn't load" on screen, a console error or an a11y violation. Full runs only (the
      # half-hourly quick run never signs in), and after verify:prod, so a push is checked on its own deploy.
      # The account is two repository SECRETS on this step alone (GT3_SMOKE_EMAIL, GT3_SMOKE_PASSWORD); the database's
      # two public values are the repository VARIABLES the iPhone build already reads. Neither secret set: NOT CHECKED,
      # and it passes. The account set and a variable not: it fails (scripts/smokeGate.mjs).
      - name: smoke:authed (the crew console, signed in)
        if: steps.form.outputs.browser == 'yes'
        timeout-minutes: 15
        env:
          GT3_SMOKE_BASE: https://app.gt3pb.com
          GT3_SMOKE_EMAIL: ${{ secrets.GT3_SMOKE_EMAIL }}
          GT3_SMOKE_PASSWORD: ${{ secrets.GT3_SMOKE_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run smoke:authed

  # WHAT SHIPS, ASKED EVERY MORNING (R30 — the 10/10 audit, operations F24). ci.yml asks npm's advisory database on every
  # push; an advisory published in a quiet week would wait for the next push to be heard. The daily full run asks again,
  # as a job of its own, so its red says "an advisory", not "the site". It reads the lockfile only — nothing installed,
  # no secret on it.
  advisories:
    if: (github.event_name == 'schedule' && github.event.schedule == '10 6 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: npm audit (what ships)
        run: npm audit --omit=dev --audit-level=high
