# THE IPHONE APP — built with Xcode, launched on a simulator, and sent to TestFlight when asked.
#
# ── WHAT THE OTHER GATE ALREADY COVERS ──────────────────────────────────────────────────────────────
# ci.yml runs `npm run verify`, which ends by building the app's copy of the screens and opening it on
# three iPhones in Chromium (scripts/smoke.native.mjs): every screen, every crew section, the safe
# areas, the status bar, the keyboard, the router, the native calls. What only a Mac can check is here.
#
#   simulator   The project compiles with Xcode 26 and the iOS 26 SDK (what App Store uploads need
#               since 2026-04-28), installs on an iPhone simulator and launches; then the app's own
#               log is read for what Capacitor prints as it starts — the bundled pages loaded, the page
#               spoke to the native side (the launch screen let go, the status bar set), no JavaScript
#               error — and a picture of the first screen is kept with the run. THE APP RUNS ON AN IPAD
#               (2026-10-11): the built app is read for what an iPad needs (both device families, the
#               iPad's four ways up, its icons), and then it is launched on an iPad simulator and read
#               the same way. A simulator that never finishes booting is named as the runner's
#               problem, never put down to the app (A BOOT THAT FAILS IS A RUNNER'S, below).
#   testflight  Run by hand only: Actions → "iPhone app" → Run workflow → tick "Upload to TestFlight".
#               Archives a signed Release build of main and uploads it to App Store Connect, which
#               hands it to TestFlight. It checks first that everything it needs is set, and stops with
#               the names of what is not; it never uploads the stand-in smoke build, or an app built
#               without its backend.
#
# ── WHAT TESTFLIGHT NEEDS, SET ONCE ON THE REPOSITORY (Settings → Secrets and variables → Actions) ─
#   Secrets     APPLE_TEAM_ID    the 10-character Team ID (developer.apple.com → Account → Membership)
#               ASC_KEY_ID       an App Store Connect API key — App Store Connect → Users and Access →
#               ASC_ISSUER_ID      Integrations → App Store Connect API, role Admin (Xcode makes the
#               ASC_KEY_P8         signing certificate and profile with it) — its Key ID, the Issuer
#                                  ID above the list, and the downloaded .p8 file's text
#   Variables   NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY (required), the web's values from
#               Vercel. The rest of the web's public settings — Square's, the subscription's, the wallets', the
#               app URL, the push key (lib/publicConfig.json lists them) — the build asks app.gt3pb.com for
#               (app/api/public-config, 2026-10-10); a variable set here under the same name wins.
#   And in App Store Connect, an app record for bundle id com.gt3pb.app ("GT3 Performance Bar").
#
# ── WHEN THE SIMULATOR RUN HAPPENS ───────────────────────────────────────────────────────────────────
# On a pull request or a push to main that touches the native side (the paths below) — a Mac minute
# costs ten Linux ones on a private repository, and the screens themselves are checked on every change
# by ci.yml — and whenever this workflow is run by hand.
name: iPhone app

on:
  pull_request:
    paths:
      - "ios/**"
      - "native/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "components/NativeBridge.tsx"
      - "lib/native.ts"
      - "scripts/build.app.mjs"
      - "scripts/ios.configure.mjs"
      - "scripts/ios.assets.mjs"
      - ".github/workflows/ios.yml"
  push:
    branches: ["main"]
    paths:
      - "ios/**"
      - "native/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "components/NativeBridge.tsx"
      - "lib/native.ts"
      - "scripts/build.app.mjs"
      - "scripts/ios.configure.mjs"
      - "scripts/ios.assets.mjs"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload to TestFlight (a signed Release build of this branch)"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    # 60, not 45 (2026-10-11): a stuck first boot now has three bounded tries before it is named the runner's, and the
    # iPad's own boot follows the iPhone's.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A guest's app: no backend address, so it asks the network for nothing and its log says only
      # what the app itself did.
      - name: The app's copy of the screens
        run: npm run build:app
      - name: Copy it into the iOS project
        run: npx cap sync ios
      - name: The project is what scripts/ios.configure.mjs makes it
        run: node scripts/ios.configure.mjs --check

      - name: Build for the simulator (Xcode 26, iOS 26 SDK)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/App/build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*GT3|BUILD (SUCCEEDED|FAILED)" || true
          test -d ios/App/build/Build/Products/Debug-iphonesimulator/App.app

      # THE APP RUNS ON AN IPAD (2026-10-11). What the built app tells iOS, read from the app itself rather than from the
      # project: the devices it installs on (UIDeviceFamily, from TARGETED_DEVICE_FAMILY), which ways each turns, that it
      # never asks for the whole screen, and both devices' icons — which Xcode makes at build time from the one 1024
      # master (scripts/ios.assets.mjs). An iPad build without its icons is one App Store Connect refuses.
      - name: The app is built for the iPhone and the iPad
        run: |
          python3 - ios/App/build/Build/Products/Debug-iphonesimulator/App.app/Info.plist <<'PY'
          import plistlib, sys
          info = plistlib.load(open(sys.argv[1], "rb"))
          four = ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationPortraitUpsideDown", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
          icon = lambda key: ((info.get(key) or {}).get("CFBundlePrimaryIcon") or {}).get("CFBundleIconName")
          checks = [
            ("it installs on an iPhone and an iPad (UIDeviceFamily 1 and 2)", sorted(info.get("UIDeviceFamily") or []) == [1, 2]),
            ("an iPhone turns upright only", info.get("UISupportedInterfaceOrientations") == ["UIInterfaceOrientationPortrait"]),
            ("an iPad turns all four ways (UISupportedInterfaceOrientations~ipad)", sorted(info.get("UISupportedInterfaceOrientations~ipad") or []) == sorted(four)),
            ("it shares an iPad's screen (no UIRequiresFullScreen)", not info.get("UIRequiresFullScreen") and not info.get("UIRequiresFullScreen~ipad")),
            ("the iPhone's icon, made from the master (CFBundleIcons)", icon("CFBundleIcons") == "AppIcon"),
            ("the iPad's icon, made from the master (CFBundleIcons~ipad)", icon("CFBundleIcons~ipad") == "AppIcon"),
            ("the launch screen (UILaunchStoryboardName)", info.get("UILaunchStoryboardName") == "LaunchScreen"),
          ]
          for name, good in checks:
              print(("ok       " if good else "MISSING  ") + name)
          bad = [name for name, good in checks if not good]
          if bad:
              print("::error::the built app is not what an iPad needs: " + "; ".join(bad))
              sys.exit(1)
          PY

      - name: Launch it on an iPhone, then an iPad, and read what each says
        run: |
          set -euo pipefail
          APP=ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          # A BOOT THAT FAILS IS A RUNNER'S, NOT THE APP'S (2026-10-07, PR #95; brought to main 2026-10-11 after runs #76,
          # #78 and #79 failed this way). The runner's simulator sometimes never finishes its first boot — PR #89 on
          # 2026-10-06; PRs #93, #94 and #95 on 2026-10-07; main's #76, #78 and #79 since: minutes of data migration
          # ("Waiting on Data Migration … LaunchServicesMigrator"), then bootstatus gives up (Status=4294967295) — and the
          # job installed the app anyway ("Unable to Install “GT3PB”", twice) and blamed it. A device counts as booted when
          # bootstatus says so cleanly (its exit code and its words: the give-up line is read whatever the exit code), or,
          # when it gives up, once Apple's own Settings opens on it and stays up — bootstatus often gives up while the
          # device is still coming up, so Settings is asked for three more minutes. A device that cannot run Settings
          # cannot judge our app: it is restarted (keeping what its first boot migrated), erased only before the last try,
          # and after the last named as the runner's problem. Each bootstatus is held to five minutes, so a try has a known
          # length. Its second-by-second progress goes to boot.log, not this log (it was a thousand lines of it); a failed
          # try prints its last lines, and the file is kept with the screenshot. NOT booted alongside the build: tried on
          # #95 (2026-10-07, 17:31 UTC), the first boot's data migration slowed everything else on the runner four to eight
          # times (npm ci 16 s → 2 min 6 s, the web build 51 s → 3 min 17 s) and the app still did not run — the boot gets
          # the runner to itself, after the build.

          # pick KIND BEST: a device of that kind this Xcode has — BEST if it is there, otherwise the first of the kind.
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          kind, best = sys.argv[1], sys.argv[2]
          found = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds if d["name"].startswith(kind)]
          found.sort(key=lambda d: (not d["name"].startswith(best), d["name"]))
          print(found[0]["udid"] if found else "")' "$1" "$2"
          }
          running() { xcrun simctl spawn "$1" launchctl list 2>/dev/null | grep -c "UIKitApplication:$2" || true; }
          # bounded SECONDS COMMAND…: the command, stopped if it runs past SECONDS (macOS has no timeout(1)).
          bounded() {
            local secs=$1; shift
            "$@" &
            local pid=$!
            ( sleep "$secs"; kill "$pid" 2>/dev/null || true ) &
            local watch=$!
            local rc=0
            wait "$pid" || rc=$?
            kill "$watch" 2>/dev/null || true
            return "$rc"
          }
          # ready UDID: Apple's own Settings opens on the device and stays up — a device that can run it can run ours.
          ready() {
            xcrun simctl launch "$1" com.apple.Preferences > /dev/null 2>&1 || return 1
            sleep 5
            local up
            up=$(running "$1" com.apple.Preferences)
            xcrun simctl terminate "$1" com.apple.Preferences > /dev/null 2>&1 || true
            [ "$up" -ge 1 ]
          }
          # settled UDID LOG: bootstatus says the device is booted, cleanly — or Settings opens on it in the next three minutes.
          settled() {
            if bounded 300 xcrun simctl bootstatus "$1" -b > "$2" 2>&1 && ! grep -q "Status=4294967295" "$2"; then return 0; fi
            local i
            for i in $(seq 1 12); do
              if ready "$1"; then echo "::notice::bootstatus gave up, but Apple's Settings opened on the device — booted"; sleep 20; return 0; fi
              sleep 15
            done
            return 1
          }
          # boot UDID NAME TRIES PREFIX: up to TRIES boots, each after the first from a restarted device and the last from
          # an erased one; false if none settled.
          boot() {
            local try
            for try in $(seq 1 "$3"); do
              if settled "$1" "${4}boot.log"; then return 0; fi
              echo "::warning::the $2 simulator could not run Apple's own Settings (try $try of $3). bootstatus's last words:"
              tail -n 6 "${4}boot.log" || true
              if [ "$try" -lt "$3" ]; then
                xcrun simctl shutdown "$1" || true
                if [ "$try" -eq $(( $3 - 1 )) ]; then echo "Erasing the $2 simulator for the last try."; xcrun simctl erase "$1" || true; fi
                xcrun simctl boot "$1" || true
              fi
            done
            return 1
          }
          # launch UDID NAME PREFIX: install the app, start it, and look 25 s later; one more go from a restarted device
          # if it did not take. INSTALLED and RUNNING say what happened, for judge.
          launch() {
            local attempt
            INSTALLED=0; RUNNING=0
            for attempt in 1 2; do
              if xcrun simctl install "$1" "$APP" > "${3}install.log" 2>&1; then
                INSTALLED=1
                # Through a terminal, so the app writes each line as it says it (to a plain file its output would sit
                # in a buffer); the launch runs until the app is stopped below.
                xcrun simctl launch --console-pty --terminate-running-process "$1" com.gt3pb.app > "${3}app.log" 2>&1 &
                sleep 25
                RUNNING=$(running "$1" com.gt3pb.app)
                if [ "$RUNNING" -ge 1 ]; then break; fi
                echo "::warning::the app was not running on the $2 25 s after launch (attempt $attempt). What it said:"
                cat "${3}app.log" || true
              else
                INSTALLED=0
                echo "::warning::the $2 simulator would not install the app (attempt $attempt). What simctl said:"
                cat "${3}install.log" || true
              fi
              if [ "$attempt" = 1 ]; then
                echo "Restarting the $2 simulator for one more go."
                xcrun simctl shutdown "$1" || true
                xcrun simctl boot "$1" || true
                settled "$1" "${3}boot-again.log" || true
              fi
            done
            xcrun simctl io "$1" screenshot "${3}first-screen.png" || true
            xcrun simctl terminate "$1" com.gt3pb.app || true
            sleep 2
          }
          # judge NAME PREFIX: what the app's own log says of its start — 0 when all is there, 1 for the app's fault, 2
          # for the runner's (a device whose system would not take an app: LaunchServices or its migration not ready).
          judge() {
            if [ "$INSTALLED" != 1 ]; then
              if grep -qiE "LaunchServices|migrat|try again later" "${2}install.log"; then return 2; fi
              echo "::error::the $1 simulator would not install the app on its last go, on a device that runs Apple's own Settings — simctl's words are above (a bundle or an Info.plist it refuses is the app's)"
              return 1
            fi
            cat "${2}app.log"
            local bad=0
            [ "$RUNNING" -ge 1 ] || { echo "::error::the app is not running on the $1 25 s after launch (crashed?)"; bad=1; }
            grep -q "Loading app at capacitor://localhost" "${2}app.log" || { echo "::error::on the $1, Capacitor never started loading the bundled pages"; bad=1; }
            grep -q "WebView loaded" "${2}app.log" || { echo "::error::on the $1, the web view never finished loading the first page"; bad=1; }
            grep -q "To Native ->  SplashScreen hide" "${2}app.log" || { echo "::error::on the $1, the page never let the launch screen go — its scripts did not run, or never reached the native side"; bad=1; }
            grep -q "To Native ->  SystemBars setStyle" "${2}app.log" || { echo "::error::on the $1, the page never set the status bar"; bad=1; }
            if grep -q "STARTUP JS ERROR" "${2}app.log"; then echo "::error::on the $1, a JavaScript error as the app started (above)"; bad=1; fi
            if grep -F "[error]" "${2}app.log"; then echo "::error::on the $1, the page logged an error (above)"; bad=1; fi
            return "$bad"
          }

          # THE IPHONE: the gate. Three tries, the last from an erased device, and then the run is named the runner's.
          IPHONE=$(pick iPhone "iPhone 17")
          test -n "$IPHONE" || { echo "::error::no iPhone simulator on this runner"; exit 1; }
          boot "$IPHONE" iPhone 3 "" || { echo "::error::the runner's iPhone simulator never finished booting, three times — a runner problem, not the app: re-run the job"; exit 1; }
          launch "$IPHONE" iPhone ""
          verdict=0; judge iPhone "" || verdict=$?
          if [ "$verdict" = 2 ]; then echo "::error::the runner's iPhone simulator would not take the app — its system was not ready (simctl's words above): a runner problem, not the app — re-run the job"; exit 1; fi
          fail=$verdict
          # Its turn over, the iPhone is shut down, so the iPad's first boot has the runner to itself.
          xcrun simctl shutdown "$IPHONE" || true

          # THE IPAD (2026-10-11): the same app, judged by the same words from its own log, once the iPhone has run it. A
          # runner that cannot boot a second device has said nothing about the app, and the iPhone above already ran it:
          # two tries, the last erased, then a warning that the iPad went unchecked this run — never a failure put down to
          # the app. So too when the iPhone's boot took the runner's time (fifteen minutes or more: the job ends by sixty)
          # or the iPhone already failed. Whatever the app does wrong on a booted iPad fails the run.
          IPAD=$(pick iPad "iPad Air 11")
          if [ "$fail" != 0 ]; then
            echo "::notice::the iPad waits for a run the iPhone passes"
          elif [ "$SECONDS" -ge 900 ]; then
            echo "::warning::the iPhone took $(( SECONDS / 60 )) minutes to boot and run — the runner is slow today, and the iPad went unchecked this run"
          elif [ -z "$IPAD" ]; then
            echo "::warning::no iPad simulator on this runner — the iPad went unchecked this run"
          elif ! boot "$IPAD" iPad 2 ipad-; then
            echo "::warning::the runner's iPad simulator never finished booting, twice — a runner problem, not the app; the iPad went unchecked this run (the iPhone above ran it)"
          else
            launch "$IPAD" iPad ipad-
            verdict=0; judge iPad ipad- || verdict=$?
            if [ "$verdict" = 2 ]; then echo "::warning::the runner's iPad simulator would not take the app — its system was not ready (simctl's words above): a runner problem, not the app; the iPad went unchecked this run"
            else fail=$verdict; fi
          fi
          exit "$fail"

      - name: Keep the first screens and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-simulator
          path: |
            first-screen.png
            app.log
            boot.log
            ipad-first-screen.png
            ipad-app.log
            ipad-boot.log
            xcodebuild.log
          if-no-files-found: ignore

  testflight:
    needs: simulator
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SQUARE_APP_ID: ${{ vars.NEXT_PUBLIC_SQUARE_APP_ID }}
      NEXT_PUBLIC_SQUARE_LOCATION_ID: ${{ vars.NEXT_PUBLIC_SQUARE_LOCATION_ID }}
      NEXT_PUBLIC_SQUARE_ENV: ${{ vars.NEXT_PUBLIC_SQUARE_ENV }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SUBSCRIPTIONS_ON: ${{ vars.NEXT_PUBLIC_SUBSCRIPTIONS_ON }}
      NEXT_PUBLIC_SUB_NAME: ${{ vars.NEXT_PUBLIC_SUB_NAME }}
      NEXT_PUBLIC_SUB_CADENCE: ${{ vars.NEXT_PUBLIC_SUB_CADENCE }}
      NEXT_PUBLIC_SUB_PRICE_6: ${{ vars.NEXT_PUBLIC_SUB_PRICE_6 }}
      NEXT_PUBLIC_SUB_PRICE_12: ${{ vars.NEXT_PUBLIC_SUB_PRICE_12 }}
      NEXT_PUBLIC_SUB_PRICE_18: ${{ vars.NEXT_PUBLIC_SUB_PRICE_18 }}
      NEXT_PUBLIC_APPLE_WALLET: ${{ vars.NEXT_PUBLIC_APPLE_WALLET }}
      NEXT_PUBLIC_GOOGLE_WALLET: ${{ vars.NEXT_PUBLIC_GOOGLE_WALLET }}
      NEXT_PUBLIC_NATIVE_PUSH: ${{ vars.NEXT_PUBLIC_NATIVE_PUSH }}
    steps:
      - name: Everything an upload needs is set
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set on the repository yet:$missing — the top of .github/workflows/ios.yml says where each comes from."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The web's public settings, for those the repository does not set (2026-10-10): build 72 carried Supabase's two
      # and none of the rest, so its checkout took no cards. The build asks app.gt3pb.com for the NEXT_PUBLIC_ settings on
      # lib/publicConfig.json's list (app/api/public-config); a repository variable, where one is set, wins.
      - name: The app's copy of the screens, with its backend
        run: npm run build:app -- --web-config https://app.gt3pb.com
      - name: Never the smoke build, never an app without its backend
        run: |
          test ! -e out/gt3-smoke-build.json || { echo "::error::out/ is the smoke build (stand-in backend)"; exit 1; }
          grep -rqF "$NEXT_PUBLIC_SUPABASE_URL" out/_next/static || { echo "::error::the build does not carry the backend address"; exit 1; }
      - name: Copy it into the iOS project
        run: npx cap sync ios
      - name: The project is what scripts/ios.configure.mjs makes it
        run: node scripts/ios.configure.mjs --check

      # The secret is the .p8 file's text. Pasted into GitHub's web form it comes back with Windows line
      # endings, and Apple's tools refuse a key whose BEGIN line ends in a carriage return: "Invalid
      # authentication key credential specified (CryptoKit.CryptoKitASN1Error.invalidPEMDocument)" (run #68,
      # twice, 2026-10-10). So the file is rebuilt from the key's own base64, whatever a paste did to its
      # layout (CRLF, lost line breaks, a dropped BEGIN or END line), and read once before Xcode sees it.
      - name: The App Store Connect key, for this run only
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          KEY="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          body=$(printf '%s' "$ASC_KEY_P8" | sed -E 's/-----(BEGIN|END)[A-Z ]*-----//g' | tr -cd 'A-Za-z0-9+/=')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 does not hold the key. Paste the whole AuthKey_$ASC_KEY_ID.p8 file into that secret, from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----."
            exit 1
          fi

      # Build number = this workflow's run number, so every upload is newer than the last.
      # The archive is NOT signed here. Automatic signing archives with a development profile, and a
      # development profile needs an iPhone registered to the team: "Your team has no devices from which
      # to generate a provisioning profile" (run #70, 2026-10-10, the first time the key got through). The
      # export below signs it for the App Store instead, with a distribution certificate and profile Xcode
      # makes through the API key — no device involved.
      - name: Archive the Release build (signed at export)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/App.xcarchive"

      # SIGN IN WITH APPLE (2026-10-11). An app built unsigned carries no entitlements, and the export signs what it
      # is given: without this step the App Store build would lack com.apple.developer.applesignin and Apple's sheet
      # would refuse it. So the app inside the archive is signed here, ad hoc, with its entitlements
      # (ios/App/App/App.entitlements, written by scripts/ios.configure.mjs), as a development-signed archive would
      # carry them; the export re-signs it for the App Store and keeps them (the App ID allows the capability).
      # Nested code first: codesign will not sign an app whose frameworks are unsigned. Stops the run if the
      # entitlement is not there, rather than shipping a button that cannot work.
      - name: Give the archive its entitlements (Sign in with Apple, alerts, links)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          test -d "$APP"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -print0 | xargs -0 -I{} codesign --force --sign - --timestamp=none "{}"
          fi
          codesign --force --sign - --timestamp=none --entitlements ios/App/App/App.entitlements "$APP"
          codesign -d --entitlements - "$APP" > entitlements.txt 2>&1 || true
          cat entitlements.txt
          if ! grep -q "com.apple.developer.applesignin" entitlements.txt; then
            echo "::error::The archive's app does not carry Sign in with Apple (com.apple.developer.applesignin)."
            exit 1
          fi
          # Alerts (2026-10-11): APNs' entitlement, which the App ID's Push Notifications capability lets the export keep.
          if ! grep -q "aps-environment" entitlements.txt; then
            echo "::error::The archive's app does not carry alerts (aps-environment)."
            exit 1
          fi
          # Universal links and password AutoFill (2026-10-11): the App ID's Associated Domains capability lets the export keep it.
          if ! grep -q "com.apple.developer.associated-domains" entitlements.txt; then
            echo "::error::The archive's app does not carry its associated domains (applinks:app.gt3pb.com)."
            exit 1
          fi

      - name: Upload to App Store Connect (TestFlight)
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -E "error:|EXPORT (SUCCEEDED|FAILED)|Upload succeeded" || true
          grep -q "EXPORT SUCCEEDED" export.log
          # What the App Store build was signed with, as the export reports it (when it writes its summary).
          if [ -f "$RUNNER_TEMP/export/DistributionSummary.plist" ]; then
            cp "$RUNNER_TEMP/export/DistributionSummary.plist" distribution-summary.plist
            grep -q "com.apple.developer.applesignin" distribution-summary.plist && echo "The App Store build carries Sign in with Apple." \
              || echo "::warning::The export's summary does not list Sign in with Apple."
            grep -q "aps-environment" distribution-summary.plist && echo "The App Store build carries alerts (APNs)." \
              || echo "::warning::The export's summary does not list alerts (aps-environment) — is Push Notifications on for the App ID?"
            grep -q "associated-domains" distribution-summary.plist && echo "The App Store build carries its universal links." \
              || echo "::warning::The export's summary does not list associated domains — is Associated Domains on for the App ID?"
          fi

      - name: Forget the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
            entitlements.txt
            distribution-summary.plist
          if-no-files-found: ignore
