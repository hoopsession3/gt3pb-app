<!--
  A TEST DOUBLE OF ONE EVENT'S PREP SCREEN, AND IT SAYS SO.

  Ryan, 2026-10-04, 10:44 PM: a screenshot of Prep › Dear Deandra Jazz Brunch and no words. Three
  weeks out, no pick list. What it showed: a strip reading "0 open · 0 critical · 21 days to go" (two
  zeros that were buttons to anchors that do not exist without a list); "✓ Complete event" beside
  "Confirmed", twenty-one days early; and five tools in three looks — two of them thin gold text that
  read as labels ("Schedule · when to leave", "Pack-out plan · kegs vs bottles").

  This is the screen after that pass, in the same state: the strip says "No pick list yet" and lands
  on the buttons that make one; Complete waits for the day; every tool is the same card.

  Same construction as my-day.html: the DOM class for class as components/CrewKpis.tsx,
  app/crew/page.tsx (PrepDetail, MenuEditor, DayBrief), components/crew/OwnerDetails.tsx,
  components/AddToCalendar.tsx and components/kit.tsx produce it, styled by the REAL app/globals.css
  and painted in the real Chromium at phone width, in the day theme and then the dark one. Every
  block names its source in `data-from`, and scripts/design.ratchet.mjs FAILS if a class used here
  no longer appears in that file.
-->
