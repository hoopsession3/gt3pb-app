<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fixture · The Pass › Collect at the window, day theme</title>
<!--
  A TEST DOUBLE OF MONEY TAKEN AT THE WINDOW, AND IT SAYS SO (2026-10-04, migration 0341).

  Ryan: "Both cash and reader." Two tickets on the pass — one still owed, with its "Collect $8.50",
  one collected in cash a minute ago, with the collector's "Cash ✓" (the undo) — and over them the
  sheet that "Picked up" opens on an owed ticket: two answers, each saying what it does to the
  count, and the quiet third, handing it over unpaid.

  Same construction as purchase-sheet.html: the DOM class for class as components/pass/Ticket.tsx,
  components/CollectSheet.tsx and components/Sheet.tsx produce it, styled by the REAL
  app/globals.css, painted in the real Chromium at phone width, day and dark. Every block names its
  source in `data-from`, and scripts/design.ratchet.mjs FAILS if a class used here no longer appears
  in that file.

  The floor that matters is the TAP FLOOR, 44px: it is worked one-handed through a window, with the
  other hand holding a cup or a card reader.
-->
<link rel="stylesheet" href="../../app/globals.css">
<style>html,body{margin:0;background:#F4EFE3}</style>
</head>
<body>
<div class="app crew-day" data-surface="console" data-from="components/AppShell.tsx">
<div class="body">
<!-- .admin, not .screen: the measurement roots at .screen when there is one, and the sheet is portaled
     outside it in the app — so the fixture keeps the class the ticket's 44px ⋯ depends on and lets
     the ratchet measure the tickets AND the sheet. -->
<section class="admin" data-from="app/crew/page.tsx">
  <!-- THE TICKET MOVED (2026-10-11, wave 2): the Pass is components/pass — the board's section is ThePass's, each ticket
       Ticket's, class for class: the number on the top row beside the name, the drinks as lines, ⋯ the ticket's menu. -->
  <div class="adm-sec" style="padding:12px 16px" data-from="components/pass/ThePass.tsx">
    <div class="adm-order pressable st-ready" role="group" aria-label="Dana, #A1B2" data-from="components/pass/Ticket.tsx">
      <button type="button" class="adm-act-more" aria-haspopup="dialog" aria-label="Actions for Dana">⋯</button>
      <div class="adm-order-top pr-10">
        <span class="flex min-w-0 flex-wrap items-baseline gap-x-2"><span class="pass-no">#A1B2</span><b class="min-w-0 truncate">Dana</b></span>
        <span class="adm-age shrink-0 calm">6m</span>
      </div>
      <div class="adm-items"><span class="pass-item">2× RISE</span></div>
      <div class="meta">$8.50 · <span class="unp">UNPAID · collect at pickup</span> · <span class="kds-stagetime">1m in stage</span></div>
      <div class="adm-actions-row">
        <button class="k-icon-btn lg shrink-0" aria-label="Move back a stage">↩</button>
        <button type="button" class="btn-sec shrink-0">Collect $8.50</button>
        <button class="adm-act done" data-from="components/pass/Ticket.tsx lib/passBoard.ts">Picked up</button>
      </div>
    </div>
    <div class="adm-order pressable st-preparing" role="group" aria-label="Lee, #C3D4" data-from="components/pass/Ticket.tsx">
      <button type="button" class="adm-act-more" aria-haspopup="dialog" aria-label="Actions for Lee">⋯</button>
      <div class="adm-order-top pr-10">
        <span class="flex min-w-0 flex-wrap items-baseline gap-x-2"><span class="pass-no">#C3D4</span><b class="min-w-0 truncate">Lee</b></span>
        <span class="adm-age shrink-0 calm">3m</span>
      </div>
      <div class="adm-items"><span class="pass-item">FLOW</span></div>
      <div class="meta">$4.25 · <span class="kds-paid">PAID · cash</span> · <span class="kds-stagetime">2m in stage</span></div>
      <div class="adm-actions-row">
        <button class="k-icon-btn lg shrink-0" aria-label="Move back a stage">↩</button>
        <button type="button" class="btn-sec shrink-0 text-ok border-ok" aria-label="Undo the cash payment from Lee">Cash ✓</button>
        <button class="adm-act primary" data-from="components/pass/Ticket.tsx lib/passBoard.ts">Mark ready</button>
      </div>
    </div>
  </div>
</section>
</div>
  <div class="sheet2-scrim" data-from="components/Sheet.tsx" style="position:static;padding:12px 0 0">
    <div class="sheet2 " role="dialog" aria-modal="true" aria-label="Collect $8.50 from Dana" style="margin:0 auto">
      <div class="sheet2-grab"></div>
      <div class="sheet2-head">
        <div class="collect-head" data-from="components/CollectSheet.tsx">
          <b>Collect $8.50 from Dana</b>
          <button type="button" class="qd-x" title="Close" aria-label="Close" data-from="components/Sheet.tsx">✕</button>
        </div>
      </div>
      <div class="sheet2-body">
        <p class="dp-hint collect-q" data-from="components/CollectSheet.tsx">Still owed. How did they pay?</p>
        <div class="collect-ways" data-from="components/CollectSheet.tsx">
          <button type="button" class="dl-card collect-way"><b>Cash</b><span>In the till. Don't ring it on Square too — it counts here.</span></button>
          <button type="button" class="dl-card collect-way"><b>Card reader</b><span>Rung on the Square reader — it counts there.</span></button>
        </div>
        <button type="button" class="collect-skip" data-from="components/CollectSheet.tsx">Hand it over unpaid</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
