<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fixture · Quick actions › Spend, day theme</title>
<!--
  A TEST DOUBLE OF THE PURCHASE SHEET, AND IT SAYS SO.

  Ryan, 2026-10-04, of Money › Spend & budget: "Should you have an open field like this or should
  it be architected differently?" The answer was a different shape: logging a purchase is a capture
  job done at the register with the receipt in hand, so it became this sheet, opened from the quick-
  actions button on any crew screen (or from the panel's "Log a purchase"). This is the sheet mid-
  entry: receipt not yet taken, an amount typed, a category chosen, today picked, two cities offered.

  Same construction as record-sheet.html: the DOM class for class as components/QuickDock.tsx,
  components/LogPurchase.tsx and components/Sheet.tsx produce it, styled by the REAL app/globals.css,
  painted in the real Chromium at phone width. Every block names its source in `data-from`, and
  scripts/design.ratchet.mjs FAILS if a class used here no longer appears in that file.

  The floor that matters most is the TAP FLOOR: 44px. It is used one-handed at a counter.
-->
<link rel="stylesheet" href="../../app/globals.css">
<style>html,body{margin:0;background:#F4EFE3}</style>
</head>
<body>
<div class="app crew-day" data-from="components/AppShell.tsx">
  <div class="sheet2-scrim" data-from="components/Sheet.tsx" style="position:static;padding:12px 0 0">
    <div class="sheet2 " role="dialog" aria-modal="true" aria-label="Quick actions" style="margin:0 auto">
      <div class="sheet2-grab"></div>
      <div class="sheet2-head">
        <div style="display:flex;align-items:center;gap:6px" data-from="components/QuickDock.tsx">
          <button type="button" class="qd-tab">Do</button>
          <button type="button" class="qd-tab">Ask GT3</button>
          <button type="button" class="qd-tab">Note</button>
          <button type="button" class="qd-tab on">Spend</button>
          <button type="button" class="qd-x" title="Close" aria-label="Close" data-from="components/Sheet.tsx">✕</button>
        </div>
      </div>
      <div class="sheet2-body">
        <div class="lp" data-from="components/LogPurchase.tsx">
          <button type="button" class="btn-sec lp-receipt">＋ Photograph the receipt</button>

          <label class="lp-f">
            <span>What it cost</span>
            <input class="note-in lp-amt" inputmode="decimal" placeholder="24.50" value="38.12" aria-label="What it cost, in dollars">
          </label>
          <label class="lp-f">
            <span>What was it <i>optional</i></span>
            <input class="note-in" placeholder="Restaurant Depot — cups and lids" aria-label="What was it">
          </label>

          <div class="lp-f" role="group" aria-label="Category">
            <span>Category</span>
            <div class="lp-chips">
              <button type="button" class="ts-chip on" aria-pressed="true">Supplies</button>
              <button type="button" class="ts-chip" aria-pressed="false">Ingredients</button>
              <button type="button" class="ts-chip" aria-pressed="false">Equipment</button>
              <button type="button" class="ts-chip" aria-pressed="false">Marketing</button>
              <button type="button" class="ts-chip" aria-pressed="false">Fees &amp; software</button>
              <button type="button" class="ts-chip" aria-pressed="false">Labor</button>
              <button type="button" class="ts-chip" aria-pressed="false">Other</button>
            </div>
          </div>

          <div class="lp-f" role="group" aria-label="When">
            <span>When</span>
            <div class="lp-chips">
              <button type="button" class="ts-chip on" aria-pressed="true">Today</button>
              <button type="button" class="ts-chip" aria-pressed="false">Yesterday</button>
              <button type="button" class="ts-chip" aria-pressed="false">Another day</button>
            </div>
          </div>
          <div class="lp-f" role="group" aria-label="City">
            <span>City</span>
            <div class="lp-chips">
              <button type="button" class="ts-chip on" aria-pressed="true">Greenville</button>
              <button type="button" class="ts-chip" aria-pressed="false">Atlanta</button>
            </div>
          </div>

          <p class="lp-ask">Supplies always needs a receipt — photograph it now and it is done.</p>

          <button type="button" class="btn-pri lp-save">Log $38.12 · Supplies</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
