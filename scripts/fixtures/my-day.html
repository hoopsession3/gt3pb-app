<!--
  A TEST DOUBLE OF MY DAY, AND IT SAYS SO.

  Ryan, 2026-10-04, a screenshot of My Day at 10:13 PM and no words; then, that night: "Clicking on
  Greenville Fit Fest today's op does nothing. Strategically look for where something is
  unnecessary information or should have operational functionality." This is the screen after both
  passes, in the same state: an owner, an event today and not yet live, three critical tasks late,
  one task of his own, and what is owed. Since "one task, one place" (later the same day) the three
  critical tasks are not a "Top 3" under the op card any more — every one of them was in Needs you's
  team list as well — they lead that list, unfolded.

  What left: the 30px greeting and the motto above everything (the date rides on the op card now),
  the "10 flags & pings for you" card that repeated the bell, "✎ Note to self" (the quick-actions
  Note tab). What arrived: the whole op card is a button that opens the event, with "Make it live"
  beside it for whoever may throw that switch; every Needs-you row is a button to the thing it names.
  And from the 10:40 PM screenshot: a row that can be answered where it is listed leads with My
  tasks' tick — the nitro tap and the grinder are "Done today" in one tap — and the initiative opens
  its own sheet.

  Same construction as purchase-sheet.html: the DOM class for class as app/crew/page.tsx,
  components/DayHeadline.tsx, components/RecordWays.tsx, components/Owed.tsx and components/kit.tsx
  produce it, styled by the REAL app/globals.css and painted in the real Chromium at phone width, in
  the day theme and then the dark one. Every block names its source in `data-from`, and
  scripts/design.ratchet.mjs FAILS if a class used here no longer appears in that file.
-->
<link rel="stylesheet" href="../../app/globals.css">
<style>html,body{margin:0;background:#F4EFE3}</style>

    <div class="dayhead" data-from="components/DayHeadline.tsx">

      <div class="owed-row late">
        <button type="button" class="task-check" aria-label="Done today: Timemore grinder" title="Done today"><span class="task-box" aria-hidden="true"></span></button>
        <button type="button" class="owed-row-go">
          <span class="owed-row-b"><b>Timemore grinder</b><i>Service due · clean last done Jun 25.</i></span>
          <span class="owed-age">71 days late</span>
          <span class="owed-c" aria-hidden="true">›</span>
        </button>
      </div>
      <button type="button" class="owed-row late">
        <span class="owed-row-b"><b>Aug 1 Launch</b><i>Initiative target · The end-of-July to Aug-1 launch: every channel live at once.</i></span>

      </button>
      <button type="button" class="owed-row">

      </button>
      <!-- The team's late tasks lead with three, unfolded: the three the headline used to repeat as
           "Top 3" (2026-10-04, one task, one place). -->

        <span class="owed-k">Team tasks late</span>
        <span class="k-count due">7</span>
      </div>
      <button type="button" class="owed-row late">

        <span class="owed-age">1 day late</span>
        <span class="owed-c" aria-hidden="true">›</span>

      <button type="button" class="owed-row late">
