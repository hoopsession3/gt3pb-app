<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fixture · Crew › My Day, day theme</title>
<!--
  A TEST DOUBLE OF MY DAY, AND IT SAYS SO.

  ONE HOME (2026-10-09, round 2 of the UX plan, approved). The same state as before — an owner, an
  event today and not yet live, three critical team tasks a few days late, one task of his own with no
  date, and what is owed: 18 late and 6 due soon, four of them equipment — painted as the home paints
  it now. The week's three numbers, each with its change and its cause; at most three things due
  today, critical first; then one row each for the equipment, for everything more than two weeks late,
  for restock, and for All tasks, which opens My tasks and Needs you whole. The numbers are made up
  for the double, the way the names in it are.

  Before (2026-10-04): Ryan's 10:13 PM screenshot and "Strategically look for where something is
  unnecessary information or should have operational functionality" — the greeting and the motto
  went, the op card became one button with "Make it live" beside it, and a row that could be answered
  where it was listed led with My tasks' tick.

  Same construction as purchase-sheet.html: the DOM class for class as app/crew/page.tsx,
  components/DayHeadline.tsx, components/RecordWays.tsx, components/HomeNumbers.tsx, components/TodayList.tsx
  and components/kit.tsx
  produce it, styled by the REAL app/globals.css and painted in the real Chromium at phone width, in
  the day theme and then the dark one. Every block names its source in `data-from`, and
  scripts/design.ratchet.mjs FAILS if a class used here no longer appears in that file.
-->
<link rel="stylesheet" href="../../app/globals.css">
<style>html,body{margin:0;background:#F4EFE3}</style>
</head>
<body>
<div class="app crew-day" data-surface="console" data-from="components/AppShell.tsx">
<div class="body">
<section class="screen admin" data-from="app/crew/page.tsx">

  <!-- The section's own content. The console header above it (the title, the lane tabs) is the same
       on every section and is not My Day's to measure. -->
  <div class="op-trans" role="region" aria-label="My Day section">

    <div class="dayhead" data-from="components/DayHeadline.tsx">
      <div class="dayhead-op">
        <button type="button" class="dayhead-op-go">
          <span class="dayhead-op-t">
            <span class="dayhead-k">Today's op · Sat, Oct 3</span>
            <b>Greenville Fit Fest</b>
            <span class="myday-brief">
              <span class="myday-brief-row"><b>Wear</b><span>Black GT3 tee, cap</span></span>
              <span class="myday-brief-row"><b>Details</b><span>Load in 7:00 at the north lot. Two-tap nitro, sampler cups.</span></span>
            </span>
          </span>
          <span class="ev-chev" aria-hidden="true">›</span>
        </button>
        <div class="str-drift-b"><button type="button" class="btn-pri btn-sm">Make it live</button></div>
      </div>
    </div>

    <!-- At most three due today, critical first, then the latest — the three the headline once
         repeated as "Top 3" lead here, once. Everything else is one row away. -->
    <div class="adm-sec" id="my-day-tasks" data-from="components/TodayList.tsx">
      <div class="k-sec" data-from="components/kit.tsx"><span class="k-sec-lbl"><h2 class="l">Today</h2></span><span class="k-sec-r"><span class="k-count" data-from="components/TodayList.tsx">9 due</span></span></div>
      <div class="owed">
        <button type="button" class="owed-row late">
          <span class="owed-row-b"><b><span class="k-ic" aria-hidden="true" data-from="components/Icon.tsx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a1.5 1.5 0 0 0 1.3 2.25h17.76a1.5 1.5 0 0 0 1.3-2.25L13.71 3.86a1.5 1.5 0 0 0-2.6 0z"/><path d="M12 9.5v4"/></svg></span>Quality-test the current batch — go / no-go on this week's sampling</b><i>event · Greenville Fit Fest</i></span>
          <span class="owed-age">4 days late</span>
          <span class="owed-c" aria-hidden="true">›</span>
        </button>
        <button type="button" class="owed-row late">
          <span class="owed-row-b"><b><span class="k-ic" aria-hidden="true" data-from="components/Icon.tsx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a1.5 1.5 0 0 0 1.3 2.25h17.76a1.5 1.5 0 0 0 1.3-2.25L13.71 3.86a1.5 1.5 0 0 0-2.6 0z"/><path d="M12 9.5v4"/></svg></span>Upstate Spine sample drop + dual-track options sheet (via Sarah)</b><i>Not attached to an event or stop</i></span>
          <span class="owed-age">1 day late</span>
          <span class="owed-c" aria-hidden="true">›</span>
        </button>
        <button type="button" class="owed-row late">
          <span class="owed-row-b"><b><span class="k-ic" aria-hidden="true" data-from="components/Icon.tsx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a1.5 1.5 0 0 0 1.3 2.25h17.76a1.5 1.5 0 0 0 1.3-2.25L13.71 3.86a1.5 1.5 0 0 0-2.6 0z"/><path d="M12 9.5v4"/></svg></span>Decide the loyalty mechanic — locked pilot (5 returns) vs session float (10)</b><i>Not attached to an event or stop</i></span>
          <span class="owed-age">1 day late</span>
          <span class="owed-c" aria-hidden="true">›</span>
        </button>
        <button type="button" class="owed-row">
          <span class="owed-row-b"><b>6 more due today</b><i>Every one, in the same order</i></span>
          <span class="owed-c" aria-hidden="true">›</span>
        </button>
        <button type="button" class="owed-row late">
          <span class="owed-row-b"><b>Equipment upkeep · 4</b><i>4 past their service date — log them in one place</i></span>
          <span class="owed-c" aria-hidden="true">›</span>
        </button>
        <button type="button" class="owed-row">
          <span class="owed-row-b"><b>More than 2 weeks late · 12</b><i>Each opens where it can be closed or moved</i></span>
          <span class="owed-c" aria-hidden="true">›</span>
        </button>
        <button type="button" class="owed-row">
          <span class="owed-row-b"><b>Restock · 4 low</b><i>For upcoming events — Assets</i></span>
          <span class="owed-c" aria-hidden="true">›</span>
        </button>
        <button type="button" class="owed-row">
          <span class="owed-row-b"><b>All tasks · 32</b><i>7 later, and everything above in full</i></span>
          <span class="owed-c" aria-hidden="true">›</span>
        </button>
      </div>
    </div>

    <div class="adm-sec" id="home-numbers" data-from="components/HomeNumbers.tsx">
      <div class="k-sec" data-from="components/kit.tsx"><span class="k-sec-lbl"><h2 class="l">Numbers</h2></span><span class="k-sec-r"><button type="button" class="owed-more -my-3.5" data-from="components/HomeNumbers.tsx">See all <span aria-hidden="true">›</span></button></span></div>
      <div class="owed">
        <button type="button" class="owed-row">
          <span class="owed-row-b"><b>Sales · 7 days</b><span class="text-caption text-cream-muted">Up 18% on the week before · Drop packs +$210</span></span>
          <span class="flex-none text-title3 font-semibold text-cream whitespace-nowrap tabular-nums">$1,240</span>
          <span class="owed-c" aria-hidden="true">›</span>
        </button>
        <button type="button" class="owed-row">
          <span class="owed-row-b"><b>Margin · 7 days, est.</b><span class="text-caption text-cream-muted">Up 10% on the week before · after $150 in event costs</span></span>
          <span class="flex-none text-title3 font-semibold text-cream whitespace-nowrap tabular-nums">$718<small class="text-footnote font-normal text-cream-muted"> · 58%</small></span>
          <span class="owed-c" aria-hidden="true">›</span>
        </button>
        <button type="button" class="owed-row">
          <span class="owed-row-b"><b>Next drop · This Sat · Oct 10</b><span class="text-caption text-cream-muted">3 more than the last drop had by now · most asked: FLOW</span></span>
          <span class="flex-none text-title3 font-semibold text-cream whitespace-nowrap tabular-nums">14 packs</span>
          <span class="owed-c" aria-hidden="true">›</span>
        </button>
      </div>
    </div>

  </div>
</section>
</div>
</div>
</body>
</html>
